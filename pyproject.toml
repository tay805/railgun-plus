[project]
name = "railgun_plus"
version = "0.1.0"
description = "Map-based MAPF policy (RAILGUN-style U-Net) composed with a PIBT corrector to eliminate deadlock collapse at high agent density."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pogema>=1.3",
    "pogema-toolbox",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Colab already has torch/numpy/matplotlib; you typically only need:
#   pip install pogema pogema-toolbox pyyaml tqdm

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
